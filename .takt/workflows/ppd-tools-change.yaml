name: ppd-tools-change
description: >-
  PPD の tools/ スクリプトとテストの変更ワークフロー。builtin の development-core に
  ppd-rules の知識を注入して計画・実装・レビュー・修正を行い、最後に tools/tests の
  機械ゲート（system step）で緑を判定する。
all_steps:
  rules:
    - ref: findings-handling
      position: before_instruction
    - ref: plain-terminology
      position: before_instruction
    - ref: ppd-coding-rules
      position: before_instruction
max_steps: 60
initial_step: develop
steps:
  - name: develop
    description: development-core で計画・テスト作成・実装・レビュー・修正・要件確認を行う
    kind: workflow_call
    call: development-core
    args:
      implementation_pool: coding-facets
      implementation_workflow: development-implement-dynamic
      remediation_workflow: development-remediation-dynamic
      plan_instruction: scenario-based-plan
      plan_report_format: scenario-based-plan
      replan_instruction: scenario-based-replan-implementation
      testing_instruction: scenario-based-write-tests-first
      testing_report_format: scenario-based-test-report
      fix_plan_instruction: scenario-based-fix-plan-from-review-resolution
      fix_replan_instruction: scenario-based-fix-replan
      fix_verification_replan_instruction: scenario-based-verification-replan
      fix_plan_report_format: scenario-based-fix-plan
      final_gate_instruction: scenario-based-supervise-review-resolution
      implementation_companions:
        fixed:
          - ai-antipattern-review-companion
          - testing-review-companion
        pool: []
        moderator: review-companion-moderator
      reviewer_suite: development-review
      review_policy_additions: []
      review_policy:
        - coding
        - testing
        - review
        - architecture
      plan_knowledge:
        - architecture
        - task-decomposition
        - ppd-rules
      testing_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
        - ppd-rules
      development_knowledge:
        - architecture
        - implementation-semantics
        - ppd-rules
      review_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
        - ppd-rules
      security_review_knowledge_additions:
        - ppd-rules
    rules:
      - condition: COMPLETE
        next: verify_tools
      - condition: ABORT
        next: ABORT
  - name: verify_tools
    description: tools/tests を固定コマンドで実行し、緑を機械判定する
    kind: system
    system_inputs:
      - type: command
        as: result
        command: |
          if python3 -m unittest discover -s tools/tests > .takt-verify-tools.log 2>&1; then printf '{"all_pass": true}'; else printf '{"all_pass": false}'; fi
        timeout_ms: 600000
        output: json
    rules:
      - condition: when(context.verify_tools.result.json.all_pass == true)
        next: COMPLETE
      - condition: when(true)
        next: develop
