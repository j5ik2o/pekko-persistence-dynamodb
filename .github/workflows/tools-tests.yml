name: Tools Tests
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: true
      test_merge:
        type: string
        default: ''
      bundle:
        type: string
        default: ''
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tools/**'
jobs:
  tools-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}
          # The bundle of a test merge built in the changes job needs the base history.
          fetch-depth: ${{ inputs.bundle != '' && '0' || '1' }}
      - uses: actions/download-artifact@v4
        if: inputs.bundle != ''
        with:
          name: ${{ inputs.bundle }}
          path: ${{ runner.temp }}/pr-test-merge
      # Every job checks the commit and parents that the changes job verified.
      - name: Check out the verified test merge
        if: inputs.test_merge != ''
        env:
          TEST_MERGE: ${{ inputs.test_merge }}
          BUNDLE: ${{ inputs.bundle }}
        run: |
          if [[ -n "$BUNDLE" ]]; then
            git fetch --quiet --no-tags "$RUNNER_TEMP/pr-test-merge/pr-test-merge.bundle" refs/pr-ci/merge
            git checkout --quiet --detach FETCH_HEAD
          fi
          # A shallow checkout hides parents from %P; the commit object keeps them.
          actual="$(git rev-parse HEAD)$(git cat-file commit HEAD | awk '!NF { exit } $1 == "parent" { printf " %s", $2 }')"
          echo "Checked out test merge (SHA, base, head): $actual"
          if [[ -z "$TEST_MERGE" || "$actual" != "$TEST_MERGE" ]]; then
            echo "::error::Expected test merge ${TEST_MERGE:-missing}"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PyYAML
        run: python3 -m pip install "PyYAML==6.0.2"
      - name: Run the tools tests
        id: run-tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s tools/tests -v 2>&1 | tee "$RUNNER_TEMP/tools-tests.log"
      - name: Check the test counts
        if: steps.run-tests.outcome == 'success'
        run: |
          expected=223
          summary=$(grep -E '^Ran [0-9]+ tests? in ' "$RUNNER_TEMP/tools-tests.log" | tail -n 1)
          if [ -z "$summary" ]; then
            echo "::error::Could not find the unittest summary line in the test output."
            exit 1
          fi
          ran=$(printf '%s\n' "$summary" | sed -E 's/^Ran ([0-9]+) tests? in .*/\1/')
          echo "Ran $ran tests (expected $expected)"
          # unittest reports skips on the result line (`OK (skipped=N)`), not on the
          # summary line, so scan the whole log for the skip marker.
          if grep -qE 'skipped=|expected failures=|unexpected successes=' "$RUNNER_TEMP/tools-tests.log"; then
            echo "::error::The run reported skips or unexpected outcomes."
            grep -nE 'skipped=|expected failures=|unexpected successes=' "$RUNNER_TEMP/tools-tests.log"
            echo "::error::Skipped tests mean PyYAML was not installed. A skipped run must fail."
            exit 1
          fi
          if [ "$ran" -lt "$expected" ]; then
            echo "::error::Ran $ran tests but expected at least $expected."
            exit 1
          fi
          if [ "$ran" -ne "$expected" ]; then
            echo "::warning::Expected $expected tests but ran $ran."
          fi
