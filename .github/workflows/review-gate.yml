name: Review gate

on:
  # Check on PR creation, updates, reopening, and readiness. Conversation
  # resolution is enforced by branch protection, so review activity needs no run.
  # Dispatch runs are isolated from PR runs because they may record against a different SHA.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-gate-${{ github.event_name }}-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  unresolved-review-threads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check unresolved review threads
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/check-review-threads.sh "${{ github.repository }}" "${{ inputs.pr || github.event.pull_request.number }}"
